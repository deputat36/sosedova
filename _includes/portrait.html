<figure class="portrait-frame broker-portrait">{% if site.data.broker.photo != '' %}<img src="{{ site.data.broker.photo | relative_url }}" alt="{{ site.data.broker.photo_alt | escape }}" width="360" height="450" decoding="async">{% else %}<div class="broker-monogram" aria-hidden="true"><span>{{ site.data.broker.initials }}</span><small>{{ site.data.broker.experience }}</small></div>{% endif %}<figcaption><strong>{{ site.data.broker.name }}</strong><span>{{ site.data.broker.role }}</span></figcaption></figure>
