<figure class="portrait-frame broker-portrait">{% if site.data.broker.photo != '' %}<picture>{% if site.data.broker.photo_mobile != '' %}<source media="(max-width: 760px)" srcset="{{ site.data.broker.photo_mobile | relative_url }}">{% endif %}<img src="{{ site.data.broker.photo | relative_url }}" alt="{{ site.data.broker.photo_alt | escape }}" width="360" height="450" decoding="async"></picture>{% else %}<div class="broker-monogram" aria-hidden="true"><span>{{ site.data.broker.initials }}</span><small>{{ site.data.broker.experience }}</small></div>{% endif %}<figcaption><strong>{{ site.data.broker.name }}</strong><span>{{ site.data.broker.role }}</span></figcaption></figure>
