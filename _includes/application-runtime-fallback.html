<section class="notice application-runtime-fallback"{% if include.runtime %} data-application-runtime-fallback hidden aria-live="polite"{% endif %}>
  <div>
    <p class="eyebrow">Резервный способ обращения</p>
    <h2>Онлайн-форма временно не загрузилась</h2>
    <p>Не вводите данные в неработающую форму. Позвоните {{ site.data.broker.dative }}, отправьте SMS или напишите во ВКонтакте.</p>
  </div>
  <div class="hero-actions">
    <a class="btn btn-primary" href="tel:{{ site.data.contacts.phone_e164 }}">Позвонить</a>
    <a class="btn btn-secondary" href="sms:{{ site.data.contacts.phone_e164 }}">Отправить SMS</a>
    {% include social-links.html %}
  </div>
</section>
