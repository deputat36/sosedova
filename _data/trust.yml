advantages:
- 15+ лет опыта в ипотеке
- Свыше 3 000 клиентов за время работы
- Индивидуальный подбор программы
- Помощь с подготовкой документов
- Сопровождение по согласованному плану
- Дистанционная работа по России
steps:
- title: Консультация
  text: Обсуждаем цель покупки, регион и ваши вопросы.
- title: Анализ ситуации
  text: Разбираем доход, взнос, кредитную нагрузку и предыдущие обращения.
- title: Подбор программы
  text: Сопоставляем условия банков с вашей задачей и объектом.
- title: Подготовка заявки
  text: Собираем необходимые сведения и проверяем комплектность документов.
- title: Сопровождение до решения банка
  text: Отслеживаем рассмотрение, помогаем ответить на запросы и разобраться в решении.
reviews:
- author: Ирина М.
  date: 12 мая 2026
  text: Людмила, огромное спасибо за сопровождение нашей сделки! Все прошло на высшем
    уровне. Рекомендую данного специалиста! Людмила помогла получить одобрение в нескольких
    банках и подобрать наилучшие условия по ипотеке и страхованию. Всегда была на
    связи, компетентно и быстро отвечала на наши вопросы.
- author: Екатерина С.
  date: 9 февраля 2026
  text: Отличный специалист, консультировала не первый раз. Благодаря грамотной работе
    Людмилы, смогла одобриться, после того как подавала самостоятельно и получила
    отказ. Всем рекомендую к сотрудничеству.
- author: Виталий Б.
  date: 2 сентября 2026
  text: Сам бы не смог пройти этот путь, сложно разобраться было самому во всех услугах,
    тратах и движениях. С вами все прошло легко и вроде бы оказалось простым, что
    казалось не возможным. Спасибо.
pricing: Проверка возможности получения ипотеки и сопровождение подачи заявки — 10
  000 ₽. При отказе банка оплата за эту услугу не взимается. Условия и момент оплаты
  фиксируются в договоре до начала работы.
price_includes:
- Анализ ситуации
