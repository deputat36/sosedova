- question: Можно обратиться из другого региона?
  answer: Да. Первичную консультацию, анализ ситуации и подготовку заявки можно пройти
    дистанционно. Необходимость личного визита на отдельных этапах зависит от банка
    и сделки.
- question: Можно ли получить помощь после отказа банка?
  answer: 'Да. Сначала разберём исходные данные и предыдущие обращения, затем определим
    дальнейшие шаги. Повторное одобрение заранее обещать нельзя: решение принимает
    банк.'
- question: Какие документы нужны для первого обращения?
  answer: Для знакомства достаточно имени, телефона и цели обращения. Не отправляйте
    паспорт, коды из SMS и фотографии документов через первичную форму. Порядок передачи
    документов обсудим отдельно.
- question: Сколько стоит сопровождение?
  answer: Стоимость зависит от задачи и объёма помощи. Состав услуги, порядок оплаты
    и дальнейшие этапы согласуем до начала работы.
- question: Помогаете ИП и самозанятым?
  answer: Да. Обсудим формат занятости, доступные подтверждения дохода и требования
    выбранных банков. Возможность кредитования зависит от конкретной ситуации.
- question: Гарантируете ли одобрение ипотеки?
  answer: Решение принимает банк. Задача брокера — оценить ситуацию, подобрать подходящую
    программу и помочь подготовить заявку, а не обещать результат до рассмотрения.
